services:
  - type: web
    name: benjamin-minko-portfolio
    env: python
    buildCommand: "python -c 'from server import publish_local, read_data, validate_projects; d,_=read_data(); publish_local(validate_projects(d[\"projects\"]))'"
    startCommand: "python server.py --port $PORT --host 0.0.0.0"
    plan: free
    autoDeploy: true
